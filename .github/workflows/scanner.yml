name: Stock Scanner

on:
  schedule:
    - cron: '0 5 * * 1-5'    # 10:30 AM IST — NSE market open
    - cron: '30 10 * * 1-5'  # 4:00 PM IST  — NSE market close
  workflow_dispatch:           # Allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install scanner dependencies
        run: |
          pip install pandas==2.2.2 numpy==1.26.4 yfinance==0.2.40 \
            tqdm sqlalchemy psycopg2-binary greenlet

      - name: Run centralized stock scanner
        env:
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
        run: |
          python backend/scanner.py
