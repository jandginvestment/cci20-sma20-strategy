name: Deploy to AWS (aws branch)

on:
  push:
    branches: [aws]
    paths:
      - 'backend/**'
      - 'infra/**'
      - 'frontend/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  SAM_STACK_NAME: cci-sma-scanner

jobs:
  # ── Deploy Lambda (backend) ─────────────────────────────────────────────────
  deploy-lambda:
    name: SAM Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: aws-actions/setup-sam@v2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: SAM Build
        run: sam build --template infra/template.yaml

      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name      ${{ env.SAM_STACK_NAME }} \
            --region          ${{ env.AWS_REGION }} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-image-repos \
            --capabilities    CAPABILITY_IAM \
            --parameter-overrides \
              DatabaseUrl="${{ secrets.DATABASE_URL }}" \
              DatabaseUrlSync="${{ secrets.DATABASE_URL_SYNC }}" \
              AdminCognitoSub="${{ secrets.ADMIN_COGNITO_SUB }}" \
              CorsOrigins="${{ secrets.CORS_ORIGINS }}"
