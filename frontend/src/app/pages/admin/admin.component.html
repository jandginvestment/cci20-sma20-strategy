<div class="admin-container">
  <div class="header-section">
    <h1>Admin Dashboard</h1>
    <button mat-stroked-button (click)="loadUsers()" [disabled]="loading">
      <mat-icon>refresh</mat-icon> Refresh
    </button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <p>Loading users...</p>
  </div>

  <table mat-table [dataSource]="users" class="mat-elevation-z8" *ngIf="!loading">
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email </th>
      <td mat-cell *matCellDef="let user"> {{user.email || 'N/A'}} </td>
    </ng-container>

    <ng-container matColumnDef="cognito_sub">
      <th mat-header-cell *matHeaderCellDef> Cognito Sub </th>
      <td mat-cell *matCellDef="let user"> 
        <span class="sub-text" title="{{user.cognito_sub}}">{{user.cognito_sub.substring(0, 8)}}...</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="created_at">
      <th mat-header-cell *matHeaderCellDef> Created At </th>
      <td mat-cell *matCellDef="let user"> {{user.created_at | date:'short'}} </td>
    </ng-container>

    <ng-container matColumnDef="watchlists_count">
      <th mat-header-cell *matHeaderCellDef> Watchlists </th>
      <td mat-cell *matCellDef="let user"> {{user.watchlists_count}} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let user">
        <button mat-icon-button color="warn" (click)="deleteUser(user.id)" title="Delete User">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
