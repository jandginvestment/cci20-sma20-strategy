AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CCI/SMA Scanner — AWS SAM (Lambda + API Gateway + Cognito).
  Scanner runs via GitHub Actions. Lambda serves the read API only.

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: "postgresql+asyncpg://... (Neon async URL for API Lambda)"
  DatabaseUrlSync:
    Type: String
    NoEcho: true
    Description: "postgresql://... (Neon sync URL — used by GitHub Actions scanner)"
  AdminCognitoSub:
    Type: String
    Default: "scanner-admin"
    Description: "Cognito sub of the user who owns the pre-loaded watchlist CSVs"
  CorsOrigins:
    Type: String
    Default: "https://jandginvestment.github.io,http://localhost:4200"
    Description: "Comma-separated list of allowed CORS origins"

Globals:
  Function:
    Runtime: python3.11
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        DATABASE_URL:          !Ref DatabaseUrl
        DATABASE_URL_SYNC:     !Ref DatabaseUrlSync
        COGNITO_REGION:        !Ref AWS::Region
        COGNITO_USER_POOL_ID:  !Ref CognitoUserPool
        COGNITO_APP_CLIENT_ID: !Ref CognitoUserPoolClient
        ADMIN_COGNITO_SUB:     !Ref AdminCognitoSub
        CORS_ORIGINS:          !Ref CorsOrigins
        AWS_REGION_NAME:       !Ref AWS::Region

Resources:

  # ── Cognito User Pool ─────────────────────────────────────────────────────────
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cci-sma-scanner-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      UserPoolTags:
        Project: cci-sma-scanner

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: cci-sma-scanner-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://jandginvestment.github.io/cci20-sma20-strategy/auth/callback
        - http://localhost:4200/auth/callback
      LogoutURLs:
        - https://jandginvestment.github.io/cci20-sma20-strategy/login
        - http://localhost:4200/login
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "cci-sma-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPool

  # ── API Lambda (FastAPI + Mangum) — read-only, no pandas/numpy ────────────────
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cci-sma-api
      CodeUri: ../backend/
      Handler: lambda_handler.handler
      MemorySize: 512
      Timeout: 30
      Description: "FastAPI scanner API — reads precomputed metrics from Neon PostgreSQL"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  # ── API Gateway HTTP API ──────────────────────────────────────────────────────
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      Description: "CCI/SMA Scanner HTTP API"
      CorsConfiguration:
        AllowOrigins:
          - https://jandginvestment.github.io
          - http://localhost:4200
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [Authorization, Content-Type, Accept]
        AllowCredentials: true
        MaxAge: 600

# ── Outputs ────────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: "API Gateway base URL — set as apiUrl in frontend environment"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  CognitoUserPoolId:
    Description: "COGNITO_USER_POOL_ID"
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  CognitoClientId:
    Description: "COGNITO_APP_CLIENT_ID"
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-ClientId"

  CognitoHostedUiDomain:
    Description: "Cognito Hosted UI base URL"
    Value: !Sub "https://cci-sma-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
